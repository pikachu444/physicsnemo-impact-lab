# Reduced execution-path check; stock upstream train.py is unchanged.
hydra:
  job:
    chdir: true
  run:
    dir: ./outputs/
experiment_name: Public-OpenRadioss-Bumper-CPU-Smoke
defaults:
  - reader: vtp
  - datapipe: point_cloud
  - training: default
  - inference: default
  - _self_
reader:
  _target_: vtp_reader_compat.Reader
training:
  num_time_steps: 11
  num_training_samples: 2
  num_validation_samples: 1
  epochs: 2
  validation_freq: 1
  save_checkpoint_freq: 1
  amp: false
  num_dataloader_workers: 0
  max_workers_preprocessing: 1
  optimizer: adam
datapipe:
  static_features: [thickness]
  dynamic_targets: []
  global_features: null
  sample_type: all_time_steps
model:
  _target_: rollout.TransolverOneShot
  _convert_: all
  functional_dim: 4
  embedding_dim: 3
  out_dim: 30
  slice_num: 16
  n_layers: 1
  n_hidden: 32
  n_head: 4
  use_te: false
  num_time_steps: 11
